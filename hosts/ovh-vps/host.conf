# hosts/ovh-vps/host.conf — non-secret host configuration, sourced by
# bootstrap.sh (on the box) and sync.sh/connect.sh/ship-keys.sh (from
# the operator's Mac). Secrets do NOT go here.
# (Named .conf, not .env — the cred-guard hooks block agents from any
# *.env path, and this file is deliberately agent-readable.)

# Tailscale MagicDNS hostname the box registers as.
TAILNET_HOSTNAME="sandbox-personal"

# Personal repos to clone into /workspace/fun/ (owner/name, via the
# github.com-personal SSH alias). Space-separated.
FUN_REPO_URLS="sr1jan/fintrack sr1jan/sandbox sr1jan/wingman"
